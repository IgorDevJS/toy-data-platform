version: 2

sources:
  - name: raw
    database: raw  
    schema: raw_movies  
    # Frescor: o dlt grava em cada linha o id da carga (`_dlt_load_id`, um timestamp unix
    # em texto). A ingestão é diária (DAG do Airflow), então um dia sem carga já é aviso e
    # uma semana é erro. O `dbt build` não mede frescor: é o `make dbt-freshness`.
    config:
      loaded_at_field: "from_unixtime(cast(_dlt_load_id as double))"
      freshness:
        warn_after: {count: 1, period: day}
        error_after: {count: 7, period: day}
    tables:
      - name: netflix_titles
      - name: meta_critic

models:
  - name: netflix_titles
    description: "tabela de filmes"
    columns:
      - name: show_id
        tests:
          - unique
          - not_null
      - name: date_added
        tests:
          # 10 títulos não têm data na fonte; uma conversão quebrada zera a coluna inteira
          - not_null:
              config:
                warn_if: ">100"
                error_if: ">100"
